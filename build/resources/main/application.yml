spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ruhadb
    username: root
    password: 1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true


logging.level:
  org.hibernate.SQL: debug

jwt:
  secret-key: VmFsdWVCdWdHZXR0ZXJzQW5kU2V0dGVyc1ZhbHVlQnVnR2V0dGVyc0FuZFNldHRlcnM=
  expiration-time: 3600000

file:
  upload:
    path: uploads/